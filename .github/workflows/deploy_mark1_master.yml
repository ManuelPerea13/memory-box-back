name: Deploy Mark1 (master)

# Deploy automático a mark1 (MicroK8s) en cada push a master.
# Corre en un self-hosted runner instalado en mark1: el registry localhost:32000
# y microk8s solo son accesibles desde esa máquina.
#
# Deploy manual: Actions -> "Deploy Mark1 (master)" -> Run workflow.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-mark1-memory-box-back-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - memory-box-back
    env:
      NS: memory-box-prod
      APP: memory-box-back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, push y rollout en mark1
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="localhost:32000/${APP}:master-${GITHUB_SHA::7}"
          echo "Imagen: ${IMAGE}"

          microk8s enable registry >/dev/null 2>&1 || true

          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

          # Aplica manifests (configmap/ingress/redis/celery) por si cambiaron.
          microk8s kubectl apply -k k8s/microk8s/overlays/prod

          # web y worker Celery comparten la misma imagen.
          microk8s kubectl -n "${NS}" set image deployment/${APP} web="${IMAGE}"
          microk8s kubectl -n "${NS}" set image deployment/memory-box-celery celery="${IMAGE}"

          microk8s kubectl -n "${NS}" rollout status deployment/${APP} --timeout=300s
          microk8s kubectl -n "${NS}" rollout status deployment/memory-box-celery --timeout=300s

      - name: Estado final
        if: always()
        shell: bash
        run: microk8s kubectl get pods -n "${NS}" -o wide
